name: Phase gates
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:secrets
      - run: pnpm audit:release
      - run: pnpm test:security
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:faults
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:pwa
      # Raw failure reports can contain short-lived invitation values.
      # Share only reviewed, sanitized evidence from docs/reports/evidence.
