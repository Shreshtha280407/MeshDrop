name: Deploy reviewed release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated deployment target
        type: choice
        options: [preview, production]
        default: preview
        required: true
      admission_paused:
        description: Explicit desired state; hosted preflight must confirm preservation
        type: choice
        options: ['true', 'false']
        default: 'true'
        required: true
      admission_action:
        description: Reopening also requires a release-bound confirmation
        type: choice
        options: [preserve, pause, reopen]
        default: preserve
        required: true
      reopen_confirmation:
        description: REOPEN:environment:current-worker-version:manifest-id
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: meshdrop-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  gates:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml
  release:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      TARGET: ${{ inputs.environment }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write private environment configuration
        id: configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          OPS_REVOKE_SECRET: ${{ secrets.OPS_REVOKE_SECRET }}
          ADMISSION_PAUSED: ${{ inputs.admission_paused }}
          ADMISSION_ACTION: ${{ inputs.admission_action }}
          ADMISSION_REOPEN_CONFIRMATION: ${{ inputs.reopen_confirmation }}
          TURN_URLS: ${{ vars.TURN_URLS }}
          TURN_SHARED_SECRET: ${{ secrets.TURN_SHARED_SECRET }}
          TURN_PROVIDER: ${{ vars.TURN_PROVIDER }}
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
          METERED_DOMAIN: ${{ vars.METERED_DOMAIN }}
          METERED_FREE_ONLY: ${{ vars.METERED_FREE_ONLY }}
          METERED_SECRET_KEY: ${{ secrets.METERED_SECRET_KEY }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: pnpm exec tsx scripts/deploy/workflow-environment.ts
      - id: prepare
        run: pnpm deploy:cloud prepare "$TARGET"
      - run: pnpm deploy:cloud dry-run "$TARGET" "$RELEASE_DIRECTORY"
        env:
          RELEASE_DIRECTORY: ${{ steps.prepare.outputs.release-directory }}
      # Create each Pages project once locally before enabling this workflow.
      # Fails closed until the separately reviewed hosted preflight/readback
      # adapter exists. A local fixture can never satisfy this publication gate.
      - run: pnpm deploy:cloud publish "$TARGET" "$RELEASE_DIRECTORY"
        env:
          RELEASE_DIRECTORY: ${{ steps.prepare.outputs.release-directory }}
      - name: Retain strictly typed secret-free lifecycle records
        if: always() && steps.prepare.outputs.journal-directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ inputs.environment }}-${{ steps.prepare.outputs.manifest-id }}
          path: ${{ steps.prepare.outputs.journal-directory }}/*.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove ephemeral deployment secrets
        if: always() && steps.configuration.outputs.created == 'true'
        run: |
          node --input-type=module <<'JS'
          import { rm } from 'node:fs/promises';
          await rm(`infrastructure/cloudflare/${process.env.TARGET}/.env`, { force: true });
          // Frozen artifacts and secret-free journals are retained for recovery.
          JS
      # Public device and TURN acceptance remain a separate human release gate.
      # Never upload browser traces, environment files or raw failure artifacts.
