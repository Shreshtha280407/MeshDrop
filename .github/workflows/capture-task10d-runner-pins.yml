name: Task 10D runner pin capture
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Capture runner image and tool pins
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          echo "ImageOS=${ImageOS:-}"
          echo "ImageVersion=${ImageVersion:-}"
          GH_PATH="$(command -v gh)"
          PSQL_PATH="$(command -v psql)"
          echo "GH_PATH=$GH_PATH"
          echo "GH_SHA256=$(sha256sum "$GH_PATH" | awk '{print $1}')"
          echo "GH_VERSION=$(gh --version | head -1)"
          echo "PSQL_PATH=$PSQL_PATH"
          echo "PSQL_SHA256=$(sha256sum "$PSQL_PATH" | awk '{print $1}')"
          echo "PSQL_VERSION=$(psql --version)"
      - name: Capture GitHub attestation trusted roots
        shell: bash
        run: |
          set -euo pipefail
          gh attestation trusted-root > trusted_root.jsonl
          echo "ROOT_SHA256=$(sha256sum trusted_root.jsonl | awk '{print $1}')"
          echo "ROOT_REVIEWED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "ROOT_VALID_UNTIL=$(date -u -d '+6 days' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "ROOT_BASE64_BEGIN"
          base64 -w0 trusted_root.jsonl
          echo
          echo "ROOT_BASE64_END"

      - name: Inspect Task 10D environment metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Shreshtha280407/MeshDrop/environments/trust-rehearsal-preview \
            --jq '{
              id: .id,
              name: .name,
              prevent_self_review: ([.protection_rules[]? | select(.type=="required_reviewers")][0].prevent_self_review // null),
              reviewer_ids: ([.protection_rules[]? | select(.type=="required_reviewers")][0].reviewers // [] | map(.reviewer.id)),
              custom_branch_policies: .deployment_branch_policy.custom_branch_policies,
              protected_branches: .deployment_branch_policy.protected_branches
            }'
