name: Hosted trust rehearsal — no release authorization
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Dedicated rehearsal scope; never a deployment target
        required: true
        type: choice
        options: [preview, production]
      expected_source_sha:
        description: Exact independently reviewed workflow/source commit
        required: true
        type: string
      expected_ref:
        description: Exact independently reviewed refs/heads/... or refs/tags/...
        required: true
        type: string
      prepared_manifest_sha256:
        description: Optional existing prepared-manifest digest; never fabricated
        required: false
        type: string

permissions: {}
concurrency:
  group: meshdrop-trust-rehearsal-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REHEARSAL_ENVIRONMENT: ${{ inputs.environment }}
  REHEARSAL_EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
  REHEARSAL_EXPECTED_REF: ${{ inputs.expected_ref }}
  REHEARSAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
  REHEARSAL_PREPARED_MANIFEST_SHA256: ${{ inputs.prepared_manifest_sha256 }}
  TRUST_REHEARSAL_REPOSITORY_ID: ${{ vars.TRUST_REHEARSAL_REPOSITORY_ID }}
  TRUST_REHEARSAL_OWNER_ID: ${{ vars.TRUST_REHEARSAL_OWNER_ID }}
  TRUST_REHEARSAL_PREVIEW_ENVIRONMENT_ID: ${{ vars.TRUST_REHEARSAL_PREVIEW_ENVIRONMENT_ID }}
  TRUST_REHEARSAL_PRODUCTION_ENVIRONMENT_ID: ${{ vars.TRUST_REHEARSAL_PRODUCTION_ENVIRONMENT_ID }}
  TRUST_REHEARSAL_REVIEWER_IDS: ${{ vars.TRUST_REHEARSAL_REVIEWER_IDS }}
  REHEARSAL_ROOTS_BASE64: ${{ vars.REHEARSAL_ROOTS_BASE64 }}
  REHEARSAL_ROOT_SHA256: ${{ vars.REHEARSAL_ROOT_SHA256 }}
  REHEARSAL_ROOT_REVIEWED_AT: ${{ vars.REHEARSAL_ROOT_REVIEWED_AT }}
  REHEARSAL_ROOT_VALID_UNTIL: ${{ vars.REHEARSAL_ROOT_VALID_UNTIL }}
  REHEARSAL_GH_PATH: ${{ vars.REHEARSAL_GH_PATH }}
  REHEARSAL_GH_SHA256: ${{ vars.REHEARSAL_GH_SHA256 }}

jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      environment-name: ${{ steps.inspect.outputs.environment-name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # GET only. No environment name is emitted unless the existing ID,
      # required direct reviewers and self-review prevention match configuration.
      - id: inspect
        run: pnpm exec tsx scripts/rehearsal/cli.ts preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REHEARSAL_RUNNER_KIND: ${{ runner.environment }}

  produce:
    needs: inspect
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.inspect.outputs.environment-name }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      rehearsal-id: ${{ steps.prepare.outputs.rehearsal-id }}
      rehearsal-artifact-id: ${{ steps.prepare.outputs.artifact-id }}
      artifact-sha256: ${{ steps.prepare.outputs.artifact-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: prepare
        run: pnpm exec tsx scripts/rehearsal/cli.ts prepare
        env:
          REHEARSAL_RUNNER_KIND: ${{ runner.environment }}
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: rehearsal-evidence/rehearsal.json
          push-to-registry: false
          create-storage-record: false
      - run: pnpm exec tsx scripts/rehearsal/cli.ts verify-produced "$BUNDLE_PATH"
        env:
          REHEARSAL_RUNNER_KIND: ${{ runner.environment }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          REHEARSAL_UUID: ${{ steps.prepare.outputs.rehearsal-id }}
          REHEARSAL_ARTIFACT_ID: ${{ steps.prepare.outputs.artifact-id }}
          REHEARSAL_ARTIFACT_SHA256: ${{ steps.prepare.outputs.artifact-sha256 }}
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trust-rehearsal-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.prepare.outputs.rehearsal-id }}
          path: |
            rehearsal-evidence/rehearsal.json
            rehearsal-evidence/bundle.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false

  recover:
    needs: [inspect, produce]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: ${{ needs.inspect.outputs.environment-name }}
    permissions:
      contents: read
      actions: read
    env:
      REHEARSAL_UUID: ${{ needs.produce.outputs.rehearsal-id }}
      REHEARSAL_ARTIFACT_ID: ${{ needs.produce.outputs.rehearsal-artifact-id }}
      REHEARSAL_ARTIFACT_SHA256: ${{ needs.produce.outputs.artifact-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact-id }}
          path: rehearsal-evidence
          merge-multiple: true
      # Re-verifies the exact signed artifact before creating credential files.
      # Uses only an operator-provisioned, rehearsal-scoped PostgreSQL login.
      - run: pnpm exec tsx scripts/rehearsal/cli.ts store
        env:
          REHEARSAL_RUNNER_KIND: ${{ runner.environment }}
          REHEARSAL_DB_CONFIGURATION: ${{ toJSON(fromJSON(vars.REHEARSAL_DATABASES_JSON)[inputs.environment]) }}
          REHEARSAL_DB_PASSWORD: ${{ secrets.REHEARSAL_DB_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trust-rehearsal-recovery-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.produce.outputs.rehearsal-id }}
          path: |
            rehearsal-evidence/head.json
            rehearsal-evidence/events.json
            rehearsal-evidence/summary.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
